<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Michael ~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ============================================================
       EASILY ADJUSTABLE POSITION VARIABLES FOR HIDDEN OBJECTS
       x / y are percentages WITHIN the enlarged frame (0-100)
       size is percentage of the frame's width
       ============================================================ */
    --burrito-x: 62;
    --burrito-y: 66;
    --burrito-size: 10;

    --jigglypuff-x: 33;
    --jigglypuff-y: 58;
    --jigglypuff-size: 11;

    --pufferfish-x: 71;
    --pufferfish-y: 40;
    --pufferfish-size: 9;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#2a1d14;
    overflow:hidden;
    font-family: 'Caveat', cursive;
    touch-action: none;
  }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1c130c 100%);
  }

  /* container that preserves the scrapbook's aspect ratio */
  #book{
    position:relative;
    width:min(96vw, 172vh);
    aspect-ratio: 1343 / 1080;
    max-height:96vh;
  }

  #book img.bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    -webkit-user-drag:none;
    user-select:none;
    border-radius:4px;
  }

  /* ---------- CLOSED SCREEN ---------- */
  #closedScreen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:50;
    transition: opacity 1.1s ease;
  }
  #closedScreen img{
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5));
  }
  #tapHint{
    position:absolute;
    bottom:6%;
    left:50%; transform:translateX(-50%);
    color:#f3e6d0;
    font-size: clamp(18px, 3vw, 30px);
    letter-spacing:1px;
    opacity:0.9;
    animation: pulseHint 2.2s ease-in-out infinite;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
    pointer-events:none;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:0.45; }
    50%{ opacity:1; }
  }

  /* opening flash */
  #openFlash{
    position:absolute; inset:0;
    background:#fff8ec;
    opacity:0;
    z-index:60;
    pointer-events:none;
  }

  /* ---------- OPEN SCRAPBOOK SCREEN ---------- */
  #openScreen{
    position:absolute; inset:0;
    opacity:0;
    z-index:10;
    transition: opacity 1s ease;
  }
  #openScreen.visible{ opacity:1; }

  #dimOverlay{
    position:absolute; inset:0;
    background:rgba(20,14,8,0.0);
    transition: background 0.5s ease;
    pointer-events:none;
    z-index:15;
  }
  #dimOverlay.dim{ background:rgba(20,14,8,0.55); }

  .heart-stamp{
    position:absolute;
    font-size: clamp(16px, 2.4vw, 26px);
    transform:translate(-50%,-50%) scale(0);
    z-index:16;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    animation: stampPop 0.5s ease forwards;
  }
  @keyframes stampPop{
    0%{ transform:translate(-50%,-50%) scale(0) rotate(-15deg); }
    70%{ transform:translate(-50%,-50%) scale(1.3) rotate(6deg); }
    100%{ transform:translate(-50%,-50%) scale(1) rotate(-4deg); }
  }

  /* instruction text — a slim overlay bar, NOT something that displaces the photo */
  #instruction{
    position:absolute;
    top:2.5%;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:640px;
    text-align:center;
    color:#3b2a18;
    background: rgba(255,250,240,0.82);
    border:1px solid rgba(120,90,50,0.22);
    border-radius:10px;
    padding: 7px 16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:35;
    opacity:0;
    transition: opacity 0.6s ease;
    pointer-events:none;
  }
  #instruction.show{ opacity:1; }
  #instruction .lead{
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(9px, 1.3vw, 11px);
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:#8a6a44;
    margin-bottom:1px;
  }
  #instruction .quote{
    font-family:'Caveat', cursive;
    font-size: clamp(15px, 2.6vw, 22px);
    font-weight:600;
    color:#2c1c0e;
    line-height:1.2;
  }

  /* ---------- ACTIVE FRAME (the polaroid being zoomed) ---------- */
  #frameActive{
    position:absolute;
    z-index:25;
    transition: left 0.9s cubic-bezier(.4,0,.2,1),
                top 0.9s cubic-bezier(.4,0,.2,1),
                width 0.9s cubic-bezier(.4,0,.2,1),
                height 0.9s cubic-bezier(.4,0,.2,1),
                box-shadow 0.9s ease;
    background:#fff;
    padding: 3.5% 3.5% 9% 3.5%;
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    display:none;
    border-radius:2px;
  }
  #frameActive.enlarged{
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
  }
  #frameActive .frame-clip{
    position:relative;
    width:100%; height:100%;
    overflow:hidden;
    border-radius:1px;
  }
  #frameActive .frame-inner{
    position:absolute; inset:0;
    width:100%; height:100%;
    transform-origin:center center;
  }
  #frameActive .frame-inner img.artwork{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
    display:block;
  }
  .hidden-object{
    position:absolute;
    width: var(--hs, 15%);
    height:auto;
    transform:translate(-50%,-50%);
    cursor:pointer;
    opacity: 0.78;
    filter: saturate(0.7) brightness(0.96) contrast(0.95);
    transition: filter 0.25s ease, opacity 0.25s ease;
    -webkit-user-drag:none;
    user-select:none;
  }
  .hidden-object.found{
    pointer-events:none;
    opacity: 1;
    filter: saturate(1) brightness(1) drop-shadow(0 3px 6px rgba(0,0,0,0.35));
  }

  .sparkle{
    position:absolute;
    font-size: 34px;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:40;
    animation: sparkleBurst 0.7s ease forwards;
  }
  @keyframes sparkleBurst{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(0deg); }
    35%{ opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(20deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.7) rotate(40deg); }
  }

  /* ---------- PAGE TURN ---------- */
  #pageTurnWrap{
    position:absolute; inset:0;
    z-index:45;
    display:none;
    perspective: 2400px;
  }
  #pageTurnLeaf{
    position:absolute; inset:0;
    transform-origin: left center;
    transform-style:preserve-3d;
    transition: transform 1.6s cubic-bezier(.55,.05,.2,1);
  }
  #pageTurnLeaf img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    backface-visibility:hidden;
  }
  #pageTurnLeaf .face-back{
    transform: rotateY(180deg);
  }
  #pageTurnLeaf.turning{
    transform: rotateY(-175deg);
  }
  #pageCurlShadow{
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.35) 100%);
    opacity:0;
    transition: opacity 1.6s ease;
    pointer-events:none;
  }
  #pageTurnLeaf.turning ~ #pageCurlShadow,
  #pageTurnWrap.showShadow #pageCurlShadow{ opacity:1; }

  /* ---------- FINAL SCREEN ---------- */
  #finalScreen{
    position:absolute; inset:0;
    opacity:0;
    z-index:5;
    transition: opacity 0.4s ease;
  }
  #finalScreen.visible{ opacity:1; z-index:46; }
  #finalText{
    position:absolute;
    left:52%; top:44%;
    transform:translate(-50%,-50%) rotate(-2deg);
    width:64%;
    max-width:560px;
    text-align:center;
    color:#211508;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(26px, 4.6vw, 46px);
    line-height:1.35;
    letter-spacing:0.5px;
    text-shadow: 0 1px 0 rgba(60,35,10,0.18);
  }
  #finalText .ink-char{
    opacity:0;
    display:inline-block;
    transform: translateY(3px);
    animation: inkAppear 0.18s ease forwards;
  }
  @keyframes inkAppear{
    from{ opacity:0; transform: translateY(3px); }
    to{ opacity:1; transform: translateY(0); }
  }

  #skipHint{
    position:fixed;
    bottom:10px; right:14px;
    color:rgba(255,255,255,0.35);
    font-family: system-ui, sans-serif;
    font-size:11px;
    z-index:99;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="book">

    <!-- CLOSED SCRAPBOOK -->
    <div id="closedScreen">
      <img class="bg" src="assets/scrapbook_closed.png" alt="closed scrapbook" draggable="false">
      <div id="tapHint">tap to open ~</div>
    </div>

    <div id="openFlash"></div>

    <!-- OPEN SCRAPBOOK -->
    <div id="openScreen">
      <img class="bg" src="assets/scrapbook_open.jpg" alt="open scrapbook" draggable="false">
      <div id="dimOverlay"></div>
      <div id="instruction">
        <div class="lead">Zoom in and find (tap):</div>
        <div class="quote" id="instructionQuote"></div>
      </div>

      <div id="frameActive">
        <div class="frame-clip">
          <div class="frame-inner" id="frameInner">
            <img class="artwork" id="frameArtwork" src="" alt="" draggable="false">
            <img class="hidden-object" id="hiddenObject" src="" alt="hidden object" draggable="false">
          </div>
        </div>
      </div>
    </div>

    <!-- PAGE TURN TRANSITION -->
    <div id="pageTurnWrap">
      <div id="pageTurnLeaf">
        <img class="face-front" src="assets/scrapbook_open.jpg" alt="">
        <img class="face-back" src="assets/scrapbook_final.jpeg" alt="">
      </div>
      <div id="pageCurlShadow"></div>
    </div>

    <!-- FINAL PAGE -->
    <div id="finalScreen">
      <img class="bg" src="assets/scrapbook_final.jpeg" alt="final page" draggable="false">
      <div id="finalText"></div>
    </div>

  </div>
</div>

<audio id="bgMusic" src="assets/bgmusic.mp3" loop preload="auto"></audio>

<script>
(function(){

  /* ===================== CONFIG ===================== */

  // Original (background) position/size of each polaroid inside the
  // open scrapbook image — used as the animation start point.
  // Values are percentages relative to the #book container.
  const FRAME_ORIGIN = {
    frame1: { left: 54.5, top: 37.5, width: 18.5, height: 22 },   // signpost polaroid
    frame2: { left: 76,   top: 37,   width: 20.5, height: 24 },   // cyberpunk polaroid
    frame3: { left: 27,   top: 49,   width: 21,   height: 25 }    // desert / snake polaroid
  };

  // Enlarged (active / centered) target size
  const FRAME_ENLARGED = { left: 3, top: 4, width: 94, height: 92 };

  const FRAMES = [
    {
      key: 'frame1',
      artwork: 'assets/frame_1.jpg',
      prompt: 'What reminds us of our favorite bedtime ritual~',
      hiddenSrc: 'assets/burrito.png',
      xVar: '--burrito-x', yVar: '--burrito-y', sizeVar: '--burrito-size'
    },
    {
      key: 'frame2',
      artwork: 'assets/frame_2.jpg',
      prompt: 'The legendary silly puff machine~',
      hiddenSrc: 'assets/jigglypuff.png',
      xVar: '--jigglypuff-x', yVar: '--jigglypuff-y', sizeVar: '--jigglypuff-size'
    },
    {
      key: 'frame3',
      artwork: 'assets/frame_3.jpg',
      prompt: 'A dragon in disguise... with pufferfish software installed~',
      hiddenSrc: 'assets/pufferfish.png',
      xVar: '--pufferfish-x', yVar: '--pufferfish-y', sizeVar: '--pufferfish-size'
    }
  ];

  const FINAL_MESSAGE = "See you in 5 days, Michael~ ❤️";

  /* ===================== ELEMENTS ===================== */

  const closedScreen   = document.getElementById('closedScreen');
  const openFlash       = document.getElementById('openFlash');
  const openScreen      = document.getElementById('openScreen');
  const dimOverlay      = document.getElementById('dimOverlay');
  const instruction     = document.getElementById('instruction');
  const instructionQuote= document.getElementById('instructionQuote');
  const frameActive     = document.getElementById('frameActive');
  const frameInner      = document.getElementById('frameInner');
  const frameArtwork    = document.getElementById('frameArtwork');
  const hiddenObject    = document.getElementById('hiddenObject');
  const bgMusic         = document.getElementById('bgMusic');
  const pageTurnWrap    = document.getElementById('pageTurnWrap');
  const pageTurnLeaf    = document.getElementById('pageTurnLeaf');
  const finalScreen     = document.getElementById('finalScreen');
  const finalText       = document.getElementById('finalText');
  const bookEl          = document.getElementById('book');

  let frameIndex = 0;
  let currentZoom = 1;
  const root = document.documentElement;

  /* ===================== AUDIO: soft "ding" via WebAudio ===================== */
  let audioCtx = null;
  function playDing(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [880, 1320].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i*0.06);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i*0.06 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.06 + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i*0.06);
        osc.stop(now + i*0.06 + 0.55);
      });
    }catch(e){ /* audio not available, fail silently */ }
  }

  /* ===================== HELPERS ===================== */

  function setFrameGeometry(pos){
    frameActive.style.left   = pos.left + '%';
    frameActive.style.top    = pos.top + '%';
    frameActive.style.width  = pos.width + '%';
    frameActive.style.height = pos.height + '%';
  }

  function spawnHeartStamp(originPos){
    const heart = document.createElement('div');
    heart.className = 'heart-stamp';
    heart.textContent = '❤️';
    heart.style.left = (originPos.left + originPos.width * 0.82) + '%';
    heart.style.top  = (originPos.top + originPos.height * 0.18) + '%';
    openScreen.appendChild(heart);
  }

  function spawnSparkle(xPercent, yPercent, container){
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.textContent = '✨';
    sp.style.left = xPercent + '%';
    sp.style.top = yPercent + '%';
    container.appendChild(sp);
    setTimeout(() => sp.remove(), 720);
  }

  /* ===================== FLOW: START ===================== */

  closedScreen.addEventListener('click', openBook, { once:true });
  closedScreen.addEventListener('touchend', function(e){ e.preventDefault(); openBook(); }, { once:true });

  function openBook(){
    // start music (user gesture satisfied)
    bgMusic.volume = 0.55;
    bgMusic.play().catch(()=>{});

    // gentle flash + close screen fade
    openFlash.style.transition = 'opacity 0.35s ease';
    openFlash.style.opacity = '0.9';
    closedScreen.style.opacity = '0';
    closedScreen.style.pointerEvents = 'none';

    setTimeout(() => {
      openFlash.style.opacity = '0';
      openScreen.classList.add('visible');
    }, 380);

    setTimeout(() => {
      closedScreen.style.display = 'none';
      startFrameSequence();
    }, 1100);
  }

  /* ===================== FLOW: FRAME SEQUENCE ===================== */

  function startFrameSequence(){
    frameIndex = 0;
    showFrame(frameIndex);
  }

  function showFrame(i){
    const data = FRAMES[i];
    const origin = FRAME_ORIGIN[data.key];

    // dim background
    dimOverlay.classList.add('dim');

    // set artwork + hidden object BEFORE showing, positioned at origin size
    frameArtwork.src = data.artwork;
    hiddenObject.src = data.hiddenSrc;
    hiddenObject.classList.remove('found');
    hiddenObject.style.left = getComputedVar(data.xVar) + '%';
    hiddenObject.style.top  = getComputedVar(data.yVar) + '%';
    hiddenObject.style.setProperty('--hs', getComputedVar(data.sizeVar) + '%');

    // reset zoom + pan
    currentZoom = 1;
    panX = 0; panY = 0;
    frameInner.style.transform = 'translate(0px,0px) scale(1)';

    frameActive.style.display = 'block';
    frameActive.classList.remove('enlarged');
    setFrameGeometry(origin);

    // instruction text
    instructionQuote.textContent = '"' + data.prompt + '"';
    instruction.classList.remove('show');

    // force reflow then animate to enlarged (near full-screen) position;
    // the instruction is a translucent overlay ON TOP of the photo, it
    // no longer displaces or shrinks it
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setFrameGeometry(FRAME_ENLARGED);
        frameActive.classList.add('enlarged');
        instruction.classList.add('show');
      });
    });

    attachZoomHandlers();
  }

  function getComputedVar(name){
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  /* click / tap detection on hidden object */
  hiddenObject.addEventListener('click', function(e){
    e.stopPropagation();
    onObjectFound(e.clientX, e.clientY);
  });

  function onObjectFound(clientX, clientY){
    const data = FRAMES[frameIndex];

    // sparkle at tap location relative to book container
    const rect = bookEl.getBoundingClientRect();
    const xPct = ((clientX - rect.left) / rect.width) * 100;
    const yPct = ((clientY - rect.top) / rect.height) * 100;
    spawnSparkle(xPct, yPct, openScreen);

    playDing();
    hiddenObject.classList.add('found');
    instruction.classList.remove('show');

    // return frame to original position
    setTimeout(() => {
      const origin = FRAME_ORIGIN[data.key];
      frameActive.classList.remove('enlarged');
      setFrameGeometry(origin);
      currentZoom = 1;
      panX = 0; panY = 0;
      frameInner.style.transform = 'translate(0px,0px) scale(1)';
    }, 380);

    // after it settles, hide it, stamp a heart, dim off, move to next
    setTimeout(() => {
      frameActive.style.display = 'none';
      dimOverlay.classList.remove('dim');
      spawnHeartStamp(FRAME_ORIGIN[data.key]);

      frameIndex++;
      if (frameIndex < FRAMES.length){
        setTimeout(() => showFrame(frameIndex), 550);
      } else {
        setTimeout(() => startPageTurn(), 900);
      }
    }, 1300);
  }

  /* ===================== ZOOM (wheel + pinch) + PAN on active frame ===================== */

  let panX = 0, panY = 0;

  function attachZoomHandlers(){
    panX = 0; panY = 0;

    frameActive.onwheel = function(e){
      e.preventDefault();
      const delta = -e.deltaY * 0.0016;
      applyZoom(currentZoom + delta);
    };

    let pinchStartDist = null;
    let pinchStartZoom = 1;

    // single-finger / mouse drag panning (only active once zoomed in)
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let panStartX = 0, panStartY = 0;

    function dragStart(x, y){
      if (currentZoom <= 1.02) return;
      isDragging = true;
      dragStartX = x; dragStartY = y;
      panStartX = panX; panStartY = panY;
    }
    function dragMove(x, y){
      if (!isDragging) return;
      panX = panStartX + (x - dragStartX);
      panY = panStartY + (y - dragStartY);
      clampPan();
      applyTransform();
    }
    function dragEnd(){ isDragging = false; }

    // mouse
    frameActive.onmousedown = function(e){
      dragStart(e.clientX, e.clientY);
    };
    window.addEventListener('mousemove', function(e){
      if (isDragging) dragMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', dragEnd);

    // touch
    frameActive.ontouchstart = function(e){
      if (e.touches.length === 2){
        pinchStartDist = getTouchDist(e.touches);
        pinchStartZoom = currentZoom;
        isDragging = false;
      } else if (e.touches.length === 1){
        dragStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    };
    frameActive.ontouchmove = function(e){
      if (e.touches.length === 2 && pinchStartDist){
        e.preventDefault();
        const dist = getTouchDist(e.touches);
        const scale = dist / pinchStartDist;
        applyZoom(pinchStartZoom * scale);
      } else if (e.touches.length === 1 && isDragging){
        e.preventDefault();
        dragMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    };
    frameActive.ontouchend = function(e){
      if (e.touches.length < 2) pinchStartDist = null;
      if (e.touches.length === 0) isDragging = false;
    };
  }

  function getTouchDist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function clampPan(){
    const rect = frameInner.getBoundingClientRect();
    // how far the scaled content extends beyond the visible clip box
    const maxX = Math.max(0, (rect.width  * (currentZoom - 1)) / 2 / currentZoom);
    const maxY = Math.max(0, (rect.height * (currentZoom - 1)) / 2 / currentZoom);
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  function applyTransform(){
    frameInner.style.transform =
      'translate(' + panX + 'px,' + panY + 'px) scale(' + currentZoom + ')';
  }

  function applyZoom(z){
    currentZoom = Math.min(3, Math.max(1, z));
    clampPan();
    applyTransform();
  }

  /* ===================== PAGE TURN → FINAL ===================== */

  function startPageTurn(){
    instruction.classList.remove('show');
    openScreen.classList.remove('visible');

    pageTurnWrap.style.display = 'block';
    // force reflow
    void pageTurnLeaf.offsetWidth;

    requestAnimationFrame(() => {
      pageTurnLeaf.classList.add('turning');
      pageTurnWrap.classList.add('showShadow');
    });

    setTimeout(() => {
      finalScreen.classList.add('visible');
      pageTurnWrap.style.display = 'none';
      startHandwriting();
    }, 1650);
  }

  /* ===================== FINAL HANDWRITING ===================== */

  function startHandwriting(){
    finalText.innerHTML = '';
    const chars = FINAL_MESSAGE.split('');
    chars.forEach((ch, idx) => {
      const span = document.createElement('span');
      span.className = 'ink-char';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = (idx * 0.07) + 's';
      finalText.appendChild(span);
    });
  }

})();
</script>

<div id="skipHint"></div>
</body>
</html>
